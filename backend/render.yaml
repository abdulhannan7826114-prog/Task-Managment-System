services:
  - type: web
    name: task-management-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
