version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: task-management-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - task-management-network

  backend:
    build: ./backend
    container_name: task-management-api
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/task-management
      JWT_SECRET: your-secret-key
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - task-management-network

  frontend:
    build: ./frontend
    container_name: task-management-ui
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - task-management-network

volumes:
  mongodb_data:

networks:
  task-management-network:
    driver: bridge
